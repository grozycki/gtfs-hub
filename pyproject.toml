[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gtfs-hub"
version = "0.1.1"
description = "Provider-agnostic GTFS schedule library for low-memory hardware"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "grozycki" }]
keywords = ["gtfs", "gtfs-realtime", "public-transport", "transit", "timetable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.10", "gtfs-realtime-bindings>=1.0"]

[project.urls]
Homepage = "https://github.com/grozycki/gtfs-hub"
Issues = "https://github.com/grozycki/gtfs-hub/issues"
Changelog = "https://github.com/grozycki/gtfs-hub/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-protobuf>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_hub"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "TC", "PYI"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "unused-awaitable",
]
